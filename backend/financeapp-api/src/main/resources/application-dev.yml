spring:
  datasource:
    url: jdbc:h2:mem:financeapp_dev;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  thymeleaf:
    cache: false

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: false