<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-theme=${theme}">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('categories')}"></nav>

<main class="container">
    <header class="page-header">
        <h1>Categorias</h1>
    </header>

    <div class="card">
        <h2>Nova categoria</h2>
        <div th:if="${createError}" class="alert alert-error" th:text="${createError}">Erro</div>
        <form th:action="@{/categories}" method="post" class="filter-row">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <div class="form-group">
                <label for="newName">Nome</label>
                <input type="text" id="newName" name="name" required placeholder="Ex: Alimentação">
            </div>
            <div class="form-group">
                <label for="newIcon">Ícone</label>
                <input type="text" id="newIcon" name="icon" placeholder="🍽️">
            </div>
            <div class="form-group">
                <label for="newColor">Cor (hex)</label>
                <input type="text" id="newColor" name="color" placeholder="#268bd2" pattern="#[0-9a-fA-F]{6}">
            </div>
            <div class="form-group filter-actions">
                <button type="submit" class="btn btn-primary">Criar</button>
            </div>
        </form>
    </div>

    <div th:if="${updateError}" class="alert alert-error" th:text="${updateError}">Erro ao atualizar</div>

    <div class="card">
        <div class="table-responsive" th:if="${!#lists.isEmpty(categories)}">
            <table class="table">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Ícone</th>
                    <th>Cor</th>
                    <th class="text-right">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cat : ${categories}">
                    <td>
                        <form th:action="@{/categories/{id}/update(id=${cat.id})}" method="post" class="inline-edit">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                            <input type="text" name="name" th:value="${cat.name}" required class="edit-input">
                    </td>
                    <td>
                            <input type="text" name="icon" th:value="${cat.icon}" class="edit-input">
                    </td>
                    <td>
                            <input type="text" name="color" th:value="${cat.color}" class="edit-input" pattern="#[0-9a-fA-F]{6}">
                    </td>
                    <td class="text-right actions">
                            <button type="submit" class="btn btn-secondary btn-sm">Salvar</button>
                        </form>
                        <form th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post" class="inline-form">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('Excluir esta categoria?');">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(categories)}">Nenhuma categoria cadastrada</p>
    </div>
</main>
</body>
</html>
