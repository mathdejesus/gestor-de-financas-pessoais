<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#268bd2" />
    <meta name="description" content="Aplicativo de gerenciamento financeiro pessoal com IA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finanças" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <title>Gestor de Finanças Pessoais</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('SW registered: ', registration);
            },
            (registrationError) => {
              console.log('SW registration failed: ', registrationError);
            }
          );
        });
      }
    </script>
  </body>
</html>
