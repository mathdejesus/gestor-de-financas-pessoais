<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-theme=${theme}">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Editar transação' : 'Nova transação')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('transactions')}"></nav>

<main class="container">
    <header class="page-header">
        <h1 th:text="${isEdit} ? 'Editar transação' : 'Nova transação'">Nova transação</h1>
        <a th:href="@{/transactions}" class="btn btn-ghost">← Voltar</a>
    </header>

    <div class="card form-card">
        <div th:if="${#fields.hasErrors('transactionForm')}" class="alert alert-error">
            <span th:each="err : ${#fields.errors('transactionForm.*')}" th:text="${err}">erro</span>
        </div>

        <form th:action="${isEdit} ? @{/transactions/{id}/update(id=${transactionId})} : @{/transactions}"
              th:object="${transactionForm}"
              method="post"
              class="form-stack">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">

            <div class="form-group">
                <label for="description">Descrição</label>
                <input type="text" id="description" th:field="*{description}" placeholder="Ex: Almoço no restaurante">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="amount">Valor (R$)</label>
                    <input type="number" id="amount" th:field="*{amount}" step="0.01" min="0.01" required
                           placeholder="0,00">
                </div>

                <div class="form-group">
                    <label for="transactionType">Tipo</label>
                    <select id="transactionType" th:field="*{transactionType}" required>
                        <option value="EXPENSE">Despesa</option>
                        <option value="INCOME">Receita</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="transactionDate">Data</label>
                    <input type="date" id="transactionDate" th:field="*{transactionDate}" required>
                </div>

                <div class="form-group">
                    <label for="categoryId">Categoria</label>
                    <select id="categoryId" th:field="*{categoryId}">
                        <option value="">Sem categoria</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Salvar alterações' : 'Criar transação'">Salvar</button>
                <a th:href="@{/transactions}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
